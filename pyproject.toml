[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
version = "0.1.0"
description = "Aeris backend FastAPI para análise climática, histórico e documentação automática."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "transformers>=4.45,<5.0",
  "pillow>=10.2.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
  "pyarrow>=15,<22",
  "scipy>=1.12,<2.0",
  "markdown>=3.6,<4.0",
  "pystac-client>=0.8,<1.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "aeris*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
]
pipeline = [
  "datasets>=3,<5",
]
